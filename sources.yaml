# Where gojobs collects vacancies from. Every source here is free and needs no
# key. To add a channel or a company, add a line and run `make run`.

site:
  title: "Go Jobs"
  # GitHub Pages project site. With a custom domain: base_url: https://example.com, base_path: ""
  base_url: "https://beknur1003.github.io/gojobs"
  base_path: "/gojobs"
  repo: "https://github.com/Beknur1003/gojobs"
  feed_days: 60   # how far back the feed goes
  keep_days: 180  # how long a vacancy stays in data/jobs.json at all

paths:
  data: data/jobs.json
  out: docs       # GitHub Pages serves /docs from main

telegram:
  backfill_pages: 10  # first read of a channel: ~200 posts of history
  daily_pages: 3      # afterwards: ~60 newest posts, plenty for one day
  channels:
    # Go-only channels: every post is presumed to be about Go.
    - { name: rabota_golang, go_only: true }
    - { name: godevjob, go_only: true }
    - { name: golang_job, go_only: true }
    # Mixed channels: a post must name Go to get in.
    - { name: forgoandrust }
    - { name: getitrussia }
    - { name: remotejobss }
    - { name: devops_jobs_feed }
    - { name: jobforjunior }
    - { name: geekjobs }
    - { name: jobs_for_it }
    - { name: remocate }
    - { name: backend_vacancy }
    # Added 2026-10-01 after `gojobs channels`: live, with Go vacancies on the last page.
    - { name: runello_rus_goland, go_only: true }
    - { name: cryptoDevJobs }
    - { name: job_web3 }
    - { name: appsec_job }
    - { name: runello_rus_backend }
    - { name: young_relocate }
    - { name: backend_frontend_jobs }
    - { name: DevOpsSRE_Jobs }
    - { name: juniors_intern_developers }
    - { name: infosec_work }
    - { name: devopssjob }
    - { name: opento_dev }
    - { name: juno_jobs }
    - { name: alljvmjobs }
    - { name: careernoborders }
    - { name: jobs_juniors_remote }

apis:
  remoteok: true
  remotive: true
  himalayas: true
  jobicy: true
  weworkremotely: true
  hn: true
  djinni: true          # Ukrainian and remote Go roles
  golangprojects: true  # Go-only board
  arbeitnow: true       # European board, every role: Go ones are filtered
  workingnomads: true
  # freehire.me: open-source (MIT) catalogue of company career pages on ~90
  # ATS platforms, read through its public keyless API. Affiliate feeds and
  # boards listed above are skipped there (see internal/repository/sources/boards/freehire.go).
  freehire: true

# Company career pages fetched every run. Thousands more are found by
# discovery below; list a company here only to read it daily no matter what.
# The slug is the part of the board URL after the host:
# boards.greenhouse.io/<slug>, jobs.lever.co/<slug>, jobs.ashbyhq.com/<slug>.
greenhouse:
  - cloudflare
  - grafanalabs
  - cockroachlabs
  - twitch
  - monzo
  - mongodb
  - datadog
  - fastly
  - tailscale
  - gitlab
  - dropbox
  - stripe
  - reddit
  - discord
  - canonical
  - planetscale
  - vercel
  - wolt

lever:
  - neon
  - binance

ashby:
  - ramp
  - linear
  - supabase
  - posthog
  - replit
  - elevenlabs
  - resend
  - clickhouse
  - railway

# Discovery probes every board listed in data/seeds/<kind>.txt in rotation and
# keeps those with Go roles in data/boards.json. Boards with Go roles at their
# last check are fetched every run; the rest wait recheck_days.
discovery:
  enabled: true
  recheck_days: 30
  per_run:            # boards probed per daily run: a full cycle takes ~a month
    greenhouse: 300
    lever: 150
    ashby: 110
    workday: 450
  workday_query: golang

http:
  timeout_seconds: 40
  delay_millis: 700   # pause between requests to the same host
  host_delay_millis:  # job-board APIs built for machine traffic
    boards-api.greenhouse.io: 150
    api.lever.co: 250
    api.ashbyhq.com: 250
    freehire.me: 400
